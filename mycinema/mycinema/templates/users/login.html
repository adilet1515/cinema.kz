
{% extends 'base.html' %}

{% block title %}
    Вход
{% endblock %}

{% block body %}

<style>
    .login-container {
        max-width: 450px;
        margin: 70px auto;
    }

    .login-card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .login-title {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .login-form p {
        margin-bottom: 20px;
    }

    .login-form label {
        display: block;
        margin-bottom: 7px;
        font-weight: 500;
        color: #333;
    }

    .login-form input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        box-sizing: border-box;
    }

    .login-form input:focus {
        border-color: #86b7fe;
        outline: none;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .login-button {
        width: 100%;
        margin-top: 10px;
    }

    .login-footer {
        text-align: center;
        margin-top: 20px;
        color: #777;
    }
</style>


<div class="container">

    <div class="login-container">

        <div class="login-card">

            <h2 class="login-title">
                Вход
            </h2>

            <form method="post" class="login-form">

                {% csrf_token %}

                {{ form.as_p }}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Войти
                </button>

            </form>

            <div class="login-footer">
                Нет аккаунта?
                <a href="{% url 'users:register' %}">
                    Зарегистрироваться
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
