
{% extends 'base.html' %}

{% block title %}
    Регистрация
{% endblock %}

{% block body %}

<style>
    .register-container {
        max-width: 500px;
        margin: 60px auto;
    }

    .register-card {
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .register-title {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .register-form p {
        margin-bottom: 20px;
    }

    .register-form label {
        display: block;
        margin-bottom: 7px;
        font-weight: 500;
        color: #333;
    }

    .register-form input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ced4da;
        border-radius: 8px;
        box-sizing: border-box;
    }

    .register-form input:focus {
        border-color: #86b7fe;
        outline: none;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.1);
    }

    .register-form ul {
        margin-top: 5px;
        padding-left: 20px;
        color: #777;
        font-size: 14px;
    }

    .register-button {
        width: 100%;
        margin-top: 10px;
    }

    .register-footer {
        text-align: center;
        margin-top: 20px;
        color: #777;
    }
</style>


<div class="container">

    <div class="register-container">

        <div class="register-card">

            <h2 class="register-title">
                Создание аккаунта
            </h2>

            <form method="post" class="register-form">

                {% csrf_token %}

                {{ form.as_p }}

                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}

                <button
                    type="submit"
                    class="btn btn-primary register-button"
                >
                    Зарегистрироваться
                </button>

            </form>

            <div class="register-footer">
                Уже есть аккаунт?
                <a href="{% url 'users:login' %}">
                    Войти
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
